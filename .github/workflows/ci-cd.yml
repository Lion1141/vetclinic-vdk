name: VetApp CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: 21
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - apps/clinic-svc
          - apps/medication-svc
          - apps/sync-svc
          - apps/audit-svc
          - apps/gateway
          - packages/contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build ${{ matrix.service }}
        run: mvn -pl ${{ matrix.service }} -am compile

      - name: Test ${{ matrix.service }}
        run: mvn -pl ${{ matrix.service }} -am test

      - name: Package ${{ matrix.service }}
        run: mvn -pl ${{ matrix.service }} -am package -DskipTests

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - clinic-svc
          - medication-svc
          - sync-svc
          - audit-svc
          - gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            vetapp/${{ matrix.service }}:latest
            vetapp/${{ matrix.service }}:${{ github.sha }}
